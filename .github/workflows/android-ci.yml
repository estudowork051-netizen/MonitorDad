name: MonitorDad Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Test Relay Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Backend Relay Tests
        working-directory: backend
        run: npm test

  build-and-test:
    name: Build & Test Android Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-read-only: false

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Compile All Modules & Build Debug APKs
        run: gradle :shared:compileDebugKotlin :ParentApp:compileDebugKotlin :KidsApp:compileDebugKotlin assembleDebug --stacktrace

      - name: Package & Verify Named APKs
        run: |
          mkdir -p build-artifacts
          cp ParentApp/build/outputs/apk/debug/ParentApp-debug.apk build-artifacts/MonitorDad-Parent-debug.apk
          cp KidsApp/build/outputs/apk/debug/KidsApp-debug.apk build-artifacts/MonitorDad-Kids-debug.apk
          test -s build-artifacts/MonitorDad-Parent-debug.apk
          test -s build-artifacts/MonitorDad-Kids-debug.apk
          ls -lh build-artifacts/

      - name: Upload MonitorDad Parent Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MonitorDad-Parent-debug
          path: build-artifacts/MonitorDad-Parent-debug.apk
          retention-days: 14

      - name: Upload MonitorDad Kids Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MonitorDad-Kids-debug
          path: build-artifacts/MonitorDad-Kids-debug.apk
          retention-days: 14

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-reports
          path: |
            **/build/reports/tests/
          retention-days: 7
